# Linked from the "Is this your project?" box on every config page (src/components/AuthorBox.astro),
# which prefills `title` and the `entry` field: keep the `entry` id as is.
name: ✏️ Change or remove a listed entry
description: Ask for an edit to an entry already in the registry, or for its removal. Requests from the repository owner are verified automatically.
title: "[Entry]: "
labels: ["entry-change"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to correct an entry (description, screenshots, tags, install steps, pinned version) or to have it taken down.
        **A bot checks who you are**: it compares the GitHub account that opens this issue with the owner of the entry's repository (or the organization that owns it, if your membership is public). When the owner asks for a removal, the entry is removed. A request from anyone else is read as a suggestion or a report, and the entry stays until a maintainer checks it.

  - type: input
    id: entry
    attributes:
      label: Entry
      description: "The entry id, `<author>/<slug>`, as in the page URL `/configs/<author>/<slug>/`."
      placeholder: catppuccin/hyprland-theme
    validations:
      required: true

  - type: dropdown
    id: request
    attributes:
      label: Request
      options:
        - Edit the details (description, screenshots, tags)
        - Fix the install steps
        - Update the pinned version
        - Remove this entry
    validations:
      required: true

  - type: dropdown
    id: relationship
    attributes:
      label: Your relationship to the project
      options:
        - I am the author or a maintainer
        - I use it
        - Other
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: What should change, and where the correct information is (a commit, a release, a screenshot link). Optional for removals.
    validations:
      required: false
