# The bot (scripts/issue-to-config.ts) reads answers by their label: keep every `label:` text as is.
name: 🐧 Submit a Linux Desktop Project
description: Add dotfiles, a theme, a bar, a launcher or any other desktop part to the 0xTsoa registry. No JSON or Git needed.
title: "[Config]: "
labels: ["new-config"]
body:
  - type: markdown
    attributes:
      value: |
        ## Add your project to 0xTsoa
        Fill in this form. A bot turns it into a validated JSON file and **opens the pull request for you**, credited to your GitHub account. If something is wrong, it comments here with what to fix; edit the issue and it runs again.

        **You need 4 things (5 minutes):**
        1. **A public repository** on GitHub, GitLab or Codeberg.
        2. **A pinned version:** a tag (`v1.0.0`) or a full commit SHA. Get the SHA with `git rev-parse HEAD`.
        3. **One screenshot link.** Easiest: drag an image into any GitHub comment box, wait for the upload, and copy the `https://github.com/user-attachments/...` link (no need to post the comment).
        4. **The commands you would type to install it.** They become the manual steps on your page *and* a guided installer that previews, backs up and can undo its changes.

        Prefer writing the JSON yourself? See [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) and `schema/minimal.config.json`.

  - type: markdown
    attributes:
      value: "### 1. What is it?"

  - type: input
    id: name
    attributes:
      label: Project Name
      description: A clear name, 3–80 characters.
      placeholder: Hyprland Paper Minimal
    validations:
      required: true

  - type: input
    id: slug
    attributes:
      label: Slug
      description: "Used in the page URL: lowercase letters, digits and hyphens, 3–48 characters. Your page will be `/configs/<your-github>/<slug>/`."
      placeholder: hyprland-paper-minimal
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Short Summary
      description: One sentence for cards and search, 10–200 characters. Say what it looks like or does, not "my dotfiles".
      placeholder: Blazing-fast Wayland desktop with Waybar, Kitty and a paper-white palette.
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Optional, up to 2000 characters. Layout, workflow, what makes it special. Also searched.
    validations:
      required: false

  - type: input
    id: license
    attributes:
      label: License (SPDX)
      description: The license of the repository, as an SPDX identifier. MIT if left empty.
      placeholder: MIT, GPL-3.0-only, CC0-1.0

  - type: markdown
    attributes:
      value: "### 2. Where does it fit? (catalogue filters)"

  - type: dropdown
    id: category
    attributes:
      label: Desktop Part
      description: The part of the desktop it covers. A full setup is "Dotfiles & full rices"; a reading list or wiki is "Lists & guides".
      options:
        - Dotfiles & full rices
        - WM & compositors
        - Bars & panels
        - Widgets & shells
        - Launchers & menus
        - Notifications
        - Docks
        - Icon themes
        - Cursor themes
        - GTK & shell themes
        - Color schemes & generators
        - Login & greeters
        - Lock screens
        - Boot (GRUB / Plymouth)
        - DE extensions
        - Tools & utilities
        - Lists & guides
    validations:
      required: true

  - type: dropdown
    id: wm
    attributes:
      label: Window Manager
      description: What it targets. Themes, icons, tools and lists that work everywhere use "Any WM / DE".
      options:
        - Hyprland
        - Sway
        - River
        - niri
        - Wayfire
        - labwc
        - i3
        - bspwm
        - Awesome
        - Qtile
        - XMonad
        - dwm
        - herbstluftwm
        - Openbox
        - GNOME
        - KDE
        - Xfce
        - Cinnamon
        - COSMIC
        - Any WM / DE
        - Other
    validations:
      required: true

  - type: dropdown
    id: theme_style
    attributes:
      label: Theme Style
      description: The dominant palette or look (powers "Browse by theme"). "Wallpaper-based" for pywal/matugen-style colors, "Other" if none fits.
      options:
        - Minimalist
        - Cyberpunk
        - Nord
        - Gruvbox
        - Dracula
        - Tokyo Night
        - Catppuccin
        - Solarized
        - Monochrome
        - Rosé Pine
        - Material
        - macOS-like
        - Wallpaper-based
        - Other
    validations:
      required: true

  - type: dropdown
    id: display_server
    attributes:
      label: Display Server
      options:
        - wayland
        - x11
        - both
    validations:
      required: true

  - type: checkboxes
    id: distros
    attributes:
      label: Distributions
      description: Where you actually tested it (up to 8). Tick only "Any" for distro-independent themes, tools and lists.
      options:
        - label: Arch
        - label: EndeavourOS
        - label: Manjaro
        - label: Fedora
        - label: NixOS
        - label: Debian
        - label: Ubuntu
        - label: Mint
        - label: Void
        - label: openSUSE
        - label: Gentoo
        - label: Alpine
        - label: Any
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: Tags
      description: Up to 10 search keywords, separated by commas or spaces (lowercase, digits, hyphens). Name components and features (`waybar`, `rofi`, `auto-install`). Skip the WM, distro and theme style; they are already filters.
      placeholder: waybar, rofi, quickshell, auto-install

  - type: markdown
    attributes:
      value: "### 3. Screenshots"

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots URLs
      description: |
        1–8 direct image links, one per line. The first one is the card thumbnail.
        Tip: drag an image into any GitHub comment box and copy the `github.com/user-attachments/...` link it creates.
        Other allowed hosts: `raw.githubusercontent.com`, `user-images.githubusercontent.com`, `i.imgur.com`, `i.redd.it`, `codeberg.org`, `gitlab.com`.
      placeholder: |
        https://github.com/user-attachments/assets/a65d939e-8b2f-41a0-aebd-330573736b1a
        https://raw.githubusercontent.com/your-user/dots/v1.0.0/preview.png
    validations:
      required: true

  - type: markdown
    attributes:
      value: "### 4. Source"

  - type: input
    id: source_repo
    attributes:
      label: Source Repository
      description: The public repository (GitHub, GitLab or Codeberg).
      placeholder: https://github.com/your-user/dotfiles
    validations:
      required: true

  - type: input
    id: source_ref
    attributes:
      label: Git Ref
      description: "The exact version people install: a tag or a full 40-character commit SHA (`git rev-parse HEAD`). Branch names like `main` are rejected: they change after review."
      placeholder: v1.0.0  or  f35639dee902020dd6309cd167956f144c7db8d6
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### 5. Install commands
        Write the commands **exactly as you would type them**, one per line. Only **Dependencies** is required, except for a list or guide (Desktop Part "Lists & guides"): leave all three empty and its page links to your repository instead of an installer.
        The site shows them as manual steps and builds a guided installer from them, which previews every change (`--dry-run`), keeps files the user already has unless they approve, backs up what it changes and can undo it (`--rollback`). Package commands are adapted to the user's distro.

        | Do | Avoid |
        |---|---|
        | `sudo pacman -S --needed waybar kitty` (or apt/dnf) | `sudo bash install.sh` for the whole thing |
        | `git clone --filter=blob:none <repo> ~/dots` then `git -C ~/dots checkout {{ref}}` | `git clone --depth 1` (can't pin the version) |
        | `cp -r ~/dots/hypr ~/dots/waybar ~/.config/` (named folders) | `cp -r ~/dots/* ~/.config/` (overwrites everything) |
        | `bash -c "$(curl -fsSL https://raw.githubusercontent.com/you/dots/{{ref}}/setup.sh)"` | `curl … \| bash` from a branch URL (rejected) |
        | `# Log out and back in` (shown as a note) | Personal values like your hostname: write `<hostname>` |

        `{{ref}}` is replaced with your Git Ref.

  - type: textarea
    id: install_deps
    attributes:
      label: "Install: Dependencies"
      description: Required (leave empty only for "Lists & guides"). Install packages and/or clone the repository.
      render: bash
      placeholder: |
        sudo pacman -S --needed hyprland waybar kitty rofi-wayland
        git clone --filter=blob:none https://github.com/your-user/dotfiles ~/dotfiles
        git -C ~/dotfiles checkout {{ref}}
    validations:
      # Not required by the form (it cannot depend on Desktop Part): scripts/issue-to-config.ts enforces it.
      required: false

  - type: textarea
    id: install_dotfiles
    attributes:
      label: "Install: Deploy"
      description: Optional. Copy the configs, apply the theme or run your own installer.
      render: bash
      placeholder: |
        mkdir -p ~/.config
        cp -r ~/dotfiles/hypr ~/dotfiles/waybar ~/dotfiles/kitty ~/.config/

  - type: textarea
    id: install_reload
    attributes:
      label: "Install: Reload"
      description: Optional. Apply or restart (reload the compositor, regenerate GRUB, enable the extension…).
      render: bash
      placeholder: hyprctl reload

  - type: input
    id: script_url
    attributes:
      label: Install Script URL
      description: Optional, rarely needed. Only if your repository ships its own `.sh` installer and you want it listed separately. Must be a raw link pinned to a tag or commit.
      placeholder: https://raw.githubusercontent.com/your-user/dots/v1.0.0/install.sh

  - type: input
    id: script_sha256
    attributes:
      label: Script SHA-256
      description: Optional. Leave empty and the bot computes it from the pinned URL.
      placeholder: leave empty

  - type: markdown
    attributes:
      value: "### 6. Components (optional, shown in the spec table)"

  - type: input
    id: bar
    attributes:
      label: Status Bar
      placeholder: Waybar

  - type: input
    id: terminal
    attributes:
      label: Terminal
      placeholder: Kitty

  - type: input
    id: launcher
    attributes:
      label: Launcher
      placeholder: Rofi (Wayland)

  - type: input
    id: shell
    attributes:
      label: Shell
      placeholder: zsh

  - type: input
    id: theme
    attributes:
      label: Theme
      description: Theme or color palette name.
      placeholder: Paper & Ink Monochrome

  - type: checkboxes
    id: checklist
    attributes:
      label: Submission Checklist
      options:
        - label: My Git ref is a tag or a full commit SHA, not a branch.
          required: true
        - label: I ran my install commands on a clean system (or a fresh user) for at least one listed distribution.
          required: true
        - label: No command pipes a download into a shell unless the URL is pinned to a tag, commit or `{{ref}}`.
          required: true
        - label: My screenshots are direct image links on an allowed host.
          required: true
        - label: I am the author of this project, or I credit the original author and respect their license.
          required: true
