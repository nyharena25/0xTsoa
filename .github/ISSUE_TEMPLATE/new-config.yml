name: 🐧 Submit a Linux Desktop Configuration
description: Add your setup (dotfiles, theme, install script) to the 0xTsoa registry. No code or Git required.
title: "[Config]: "
labels: ["new-config"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🚀 Welcome to the 0xTsoa Registry!
        Thanks for sharing your setup with the community. 💙

        **How it works:** once you submit this form, our bot converts it into a validated JSON spec and **opens a Pull Request for you**. Your GitHub account is automatically credited as the author.

        > 💡 **Before you start:** have a pinned commit SHA or tag, plus at least one screenshot hosted on `raw.githubusercontent.com`, `github.com/user-attachments`, `user-images.githubusercontent.com` or `i.imgur.com`.

  - type: markdown
    attributes:
      value: "### 🏷️ Identity"

  - type: input
    id: name
    attributes:
      label: Configuration Name
      description: A clear, memorable name (3–80 characters).
      placeholder: Hyprland Paper Minimal
    validations:
      required: true

  - type: input
    id: slug
    attributes:
      label: Slug
      description: Short identifier used in the URL. Lowercase letters, digits and hyphens only (3–48 characters).
      placeholder: hyprland-paper-minimal
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Short Summary
      description: One sentence describing the intent and philosophy of your desktop (10–200 characters).
      placeholder: Blazing-fast Wayland desktop on Arch Linux with Waybar and Kitty.
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Optional. Layout philosophy, workflow, ergonomics tips, what makes it special (max 2000 characters).
    validations:
      required: false

  - type: input
    id: license
    attributes:
      label: License (SPDX)
      description: SPDX identifier of your dotfiles' license. Defaults to MIT if left empty.
      placeholder: MIT, GPL-3.0-only, Apache-2.0

  - type: markdown
    attributes:
      value: "### 🖥️ Environment"

  - type: dropdown
    id: wm
    attributes:
      label: Window Manager
      description: Your window manager, compositor or desktop environment.
      options:
        - Hyprland
        - Sway
        - River
        - niri
        - Wayfire
        - labwc
        - i3
        - bspwm
        - Awesome
        - Qtile
        - XMonad
        - dwm
        - herbstluftwm
        - Openbox
        - GNOME
        - KDE
        - Xfce
        - Cinnamon
        - COSMIC
        - Other
    validations:
      required: true

  - type: dropdown
    id: display_server
    attributes:
      label: Display Server
      options:
        - wayland
        - x11
        - both
    validations:
      required: true

  - type: checkboxes
    id: distros
    attributes:
      label: Distributions
      description: Distributions your setup has been tested on (up to 8).
      options:
        - label: Arch
        - label: EndeavourOS
        - label: Manjaro
        - label: Fedora
        - label: NixOS
        - label: Debian
        - label: Ubuntu
        - label: Mint
        - label: Void
        - label: openSUSE
        - label: Gentoo
        - label: Alpine
        - label: Any
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: Tags
      description: Up to 10 keywords, separated by commas or spaces (lowercase, digits, hyphens).
      placeholder: battery-tuned, waybar, monochrome

  - type: markdown
    attributes:
      value: "### 📸 Screenshots"

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots URLs
      description: |
        Direct `https://` image links, one per line (1–8). Allowed hosts: `raw.githubusercontent.com`, `github.com/user-attachments`, `user-images.githubusercontent.com`, `i.imgur.com`.
        Clean 1080p / 1440p captures of your desktop, bar or fastfetch work best.
      placeholder: |
        https://raw.githubusercontent.com/your-user/dots/v1.0.0/preview.png
        https://i.imgur.com/abc123.png
    validations:
      required: true

  - type: markdown
    attributes:
      value: "### 🔐 Source & Installation"

  - type: input
    id: source_repo
    attributes:
      label: Source Repository
      description: Public repository hosting your dotfiles (GitHub, GitLab or Codeberg).
      placeholder: https://github.com/your-user/dotfiles
    validations:
      required: true

  - type: input
    id: source_ref
    attributes:
      label: Git Ref
      description: A full 40-character commit SHA or a version tag. Branches like `main` are rejected to guarantee reproducible builds.
      placeholder: v1.0.0
    validations:
      required: true

  - type: input
    id: script_url
    attributes:
      label: Install Script URL
      description: Optional. HTTPS link to your `.sh` installer, pinned to a commit SHA or tag.
      placeholder: https://raw.githubusercontent.com/your-user/dots/v1.0.0/install.sh

  - type: input
    id: script_sha256
    attributes:
      label: Script SHA-256
      description: Optional. Leave empty and our bot will compute the checksum for you. ✨ (Get it locally with `sha256sum install.sh`.)
      placeholder: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855

  - type: markdown
    attributes:
      value: "### 🧩 Components (all optional)"

  - type: input
    id: bar
    attributes:
      label: Status Bar
      placeholder: Waybar

  - type: input
    id: terminal
    attributes:
      label: Terminal
      placeholder: Kitty

  - type: input
    id: launcher
    attributes:
      label: Launcher
      placeholder: Rofi (Wayland)

  - type: input
    id: shell
    attributes:
      label: Shell
      placeholder: zsh

  - type: input
    id: theme
    attributes:
      label: Theme
      description: Theme or color palette name.
      placeholder: Paper & Ink Monochrome

  - type: input
    id: ram_idle
    attributes:
      label: Idle RAM
      description: Memory usage at idle, in MiB (numbers only).
      placeholder: "280"

  - type: dropdown
    id: battery_profile
    attributes:
      label: Battery Profile
      description: Is your setup tuned for battery life?
      options:
        - "No"
        - "Yes (tlp / auto-cpufreq / power-profiles-daemon)"

  - type: checkboxes
    id: checklist
    attributes:
      label: Submission Checklist
      options:
        - label: My Git ref is a commit SHA or a tag, not a branch.
          required: true
        - label: My screenshots are hosted on an allowed host.
          required: true
        - label: My install script (if any) contains no obfuscated code, unverified binaries or silent privilege escalation.
          required: true
        - label: I am the author of this setup, or I credit the original author and respect their license.
          required: true
