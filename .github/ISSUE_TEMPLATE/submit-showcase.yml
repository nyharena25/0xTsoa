name: Submit Linux Showcase Setup
description: Submit your custom Linux desktop setup to the 0xTsoa registry.
title: "[Showcase]: "
labels: ["showcase-submission"]
body:
  - type: markdown
    attributes:
      value: |
        ### Welcome to the 0xTsoa Showcase Registry!
        Fill out the structured fields below to submit your Linux desktop setup.
        Our automated ingestion pipeline will analyze your submission, track community reactions, and rank featured setups.

  - type: input
    id: project_name
    attributes:
      label: Project Name
      description: The human-readable name of your Linux desktop configuration.
      placeholder: Hyprland Paper Minimal
    validations:
      required: true

  - type: input
    id: author_github
    attributes:
      label: Author GitHub Username
      description: Your GitHub username (without @).
      placeholder: octocat
    validations:
      required: true

  - type: input
    id: repo_url
    attributes:
      label: Repository URL
      description: URL of your public GitHub dotfiles/setup repository (must start with https://github.com/).
      placeholder: https://github.com/author/dotfiles
    validations:
      required: true

  - type: dropdown
    id: distribution
    attributes:
      label: Linux Distribution
      description: Primary Linux distribution targeted by this configuration.
      options:
        - Arch
        - Ubuntu
        - Fedora
        - Debian
        - Gentoo
        - Other
    validations:
      required: true

  - type: dropdown
    id: wm
    attributes:
      label: Window Manager / Desktop Environment
      description: The window manager, compositor, or desktop environment used.
      options:
        - Hyprland
        - i3wm
        - GNOME
        - KDE Plasma
        - Sway
        - XFCE
        - Other
    validations:
      required: true

  - type: textarea
    id: short_description
    attributes:
      label: Short Description
      description: Brief description explaining your desktop workflow, philosophy, and components.
      placeholder: Fast, minimalist Wayland desktop optimized for high battery life with Kitty, Waybar, and custom shell utilities.
    validations:
      required: true
