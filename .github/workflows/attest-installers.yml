name: Attest installers

# Signs every generated install.sh with GitHub's build provenance (Sigstore), so users can check
# a downloaded script with `gh attestation verify install.sh --repo <owner>/<repo> --signer-workflow
# <owner>/<repo>/.github/workflows/attest-installers.yml` (keep this path in sync with ATTEST_WORKFLOW
# in src/lib/install.ts). The key lives
# with GitHub and this workflow, not with the website: a tampered file served by the site fails.
# Scripts are a pure function of the reviewed configs, so Vercel serves these exact bytes.
on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build installers
        # Locally installed astro (package-lock), never an on-demand npx download.
        run: npm run build:site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ShellCheck installers
        run: |
          shellcheck -s bash -S style src/lib/installer-runtime.sh
          shellcheck -S warning -e SC2088 dist/configs/*/*/install.sh

      - name: Attest installers
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/configs/*/*/install.sh'
