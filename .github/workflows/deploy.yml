name: Deploy Static Site to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # One issue per config collects the ✓ Sign-Off reactions (needs `issues: write`).
      - name: Ensure a vote issue exists for every config
        continue-on-error: true
        run: npm run vote-issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `prebuild` fetches the votes. Owner/repo/base path come from GITHUB_REPOSITORY
      # (see site.config.ts), which is set on every trigger including the nightly cron.
      - name: Build static site & Pagefind index
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
