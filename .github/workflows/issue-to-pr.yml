name: Convert Issue Form to Pull Request

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  issue-to-pr:
    if: contains(github.event.issue.labels.*.name, 'new-config')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Untrusted input goes through env vars, never inlined into the script (shell injection).
      - name: Save issue body
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: printf '%s\n' "$ISSUE_BODY" > temp_issue_body.md

      - name: Convert Issue to Configuration JSON
        env:
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: npm run issue-to-config -- temp_issue_body.md "$ISSUE_AUTHOR"

      - name: Clean temporary issue body
        run: rm -f temp_issue_body.md

      - name: Run Schema Validation
        run: npm run validate

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(config): add configuration from issue #${{ github.event.issue.number }}"
          title: "[Config Submission]: ${{ github.event.issue.title }} (#${{ github.event.issue.number }})"
          body: |
            Cette Pull Request a été générée automatiquement depuis l'issue #${{ github.event.issue.number }}.
            
            - Auteur : @${{ github.event.issue.user.login }}
            - Issue source : #${{ github.event.issue.number }}
            
            Une fois validée et fusionnée, la configuration sera intégrée automatiquement au registre et déployée.
          branch: "config/issue-${{ github.event.issue.number }}"
          labels: "automated-pr, community-config"

      - name: Comment on Issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✓ Votre configuration a été analysée avec succès et une Pull Request a été créée automatiquement ! Les mainteneurs vont la relire prochainement.'
            })
