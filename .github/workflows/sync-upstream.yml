name: Sync Upstream Repositories

# Nightly: move every config to its repo's latest commit, refresh its version tag and star count,
# and open/update a Pull Request on branch bot/upstream-sync for review.
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          token: ${{ secrets.BOT_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Pull latest upstream refs, versions and stars
        run: npm run sync-upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate updated configs
        run: npm run validate

      - name: Set sync date
        run: echo "SYNC_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Create or update Pull Request
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          token: ${{ secrets.BOT_TOKEN }}
          add-paths: |
            configs
            src/generated/repo-stats.json
          commit-message: "chore: sync configs with upstream repositories"
          branch: bot/upstream-sync
          title: "chore: upstream ref updates (${{ env.SYNC_DATE }})"
          body-path: sync-summary.md
          labels: upstream-sync
