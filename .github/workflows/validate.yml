name: Validate Configurations & Code

permissions:
  contents: read

on:
  # Every PR runs validate: it is a required check on main, so it must always report.
  pull_request:
  push:
    branches:
      - main
      - dev
    paths:
      - 'configs/**'
      - 'schema/**'
      - 'src/**'
      - 'scripts/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type-check Astro & TypeScript
        run: npm run typecheck

      - name: Validate Configs Schema & Script Checksums
        run: npm run validate -- --scripts

      - name: Validate Changed Configs (Network)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mapfile -t changed < <(git diff --name-only --diff-filter=ACMR "origin/${BASE_REF}...HEAD" -- 'configs/**/*.json' 'configs/*/*.json')
          if [ "${#changed[@]}" -gt 0 ]; then
            npm run validate -- --network --only "${changed[@]}"
          else
            echo "No changed config files to network-validate."
          fi

      - name: Run Automated Tests
        run: npm run test

      - name: Dry Run Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
