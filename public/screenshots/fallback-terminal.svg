<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121214"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#27272a" stroke-width="0.5"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)" opacity="0.6"/>

  <!-- Window chrome -->
  <rect x="100" y="75" width="600" height="300" rx="8" fill="#09090b" stroke="#3f3f46" stroke-width="1.5"/>
  <rect x="100" y="75" width="600" height="36" rx="8" fill="#18181b"/>
  <line x1="100" y1="111" x2="700" y2="111" stroke="#27272a" stroke-width="1"/>

  <!-- Window controls -->
  <circle cx="124" cy="93" r="5" fill="#ef4444"/>
  <circle cx="140" cy="93" r="5" fill="#eab308"/>
  <circle cx="156" cy="93" r="5" fill="#22c55e"/>

  <text x="400" y="97" font-family="monospace" font-size="11" fill="#71717a" text-anchor="middle">terminal // 0xtsoa preview</text>

  <!-- Terminal content -->
  <text x="130" y="150" font-family="monospace" font-size="13" fill="#10b981" font-weight="bold">$</text>
  <text x="145" y="150" font-family="monospace" font-size="13" fill="#f4f4f5">0xtsoa inspect --visual</text>

  <text x="130" y="180" font-family="monospace" font-size="12" fill="#a1a1aa">[INFO] Remote desktop capture placeholder</text>
  <text x="130" y="204" font-family="monospace" font-size="12" fill="#71717a">[SYSTEM] Window Manager compositor verified</text>
  <text x="130" y="228" font-family="monospace" font-size="12" fill="#71717a">[SPECS] Native Wayland / X11 visual environment</text>

  <rect x="130" y="260" width="12" height="18" fill="#10b981">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
